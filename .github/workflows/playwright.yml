name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  regression:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    # 1. This repo (the Playwright framework)
    - name: Check out Playwright repo
      uses: actions/checkout@v4

    # 2. The test site, into a subfolder
    - name: Check out test site
      uses: actions/checkout@v4
      with:
        repository: samGreenwood2022/tradesource-site
        ref: master
        path: site

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    # 3. Start the site and wait until it answers. Uses 127.0.0.1 rather than
    # localhost: on newer runners localhost can resolve to IPv6 (::1) first, and
    # the connection fails. If the site doesn't start, its log is printed
    - name: Start site
      run: |
        nohup npm start --prefix site > site.log 2>&1 &
        if ! curl --silent --show-error --fail --retry 30 --retry-delay 1 --retry-all-errors --output /dev/null http://127.0.0.1:4321; then
          echo "The site did not start. Its log:"
          cat site.log
          exit 1
        fi
        echo "Site is up"

    # 4. Install deps and run the tests against the running site
    - name: Install dependencies
      run: npm ci
    # Browsers are cached per Playwright version. On a cache hit only the OS
    # dependencies are installed, as these live outside the cached folder
    - name: Get Playwright version
      id: playwright-version
      run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps
    - name: Install Playwright OS dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps
    - name: Run Playwright tests
      run: npx playwright test
      env:
        # Overrides baseURL (localhost) in playwright.config.ts, for the same IPv6 reason as above
        BASE_URL: http://127.0.0.1:4321
        EMAIL: ${{ secrets.EMAIL }}
        PASSWORD: ${{ secrets.PASSWORD }}

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 14
